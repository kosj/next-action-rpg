name: Validate and build RUNEFALL

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      windows:
        description: Build Windows x86_64 as well
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: runefall-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUNEFALL_TOOLS_DIR: /tmp/runefall-tools
      XDG_DATA_HOME: /tmp/runefall-data
      XDG_CACHE_HOME: /tmp/runefall-cache
      GODOT_BIN: /tmp/runefall-tools/godot
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Validate project knowledge and art production contracts
        run: |
          python tools/knowledge.py check
          python -m unittest discover -s tools/tests -p 'test_*.py'
          python tools/check_art_production.py
          python tools/inspect_glb.py game/assets/models/*.glb game/assets/models/production/*.glb --require-embedded
          python tools/inspect_glb.py art_source/production/candidates/*/*.glb --require-embedded
          python tools/inspect_glb.py art_source/production/candidates/lyra-001/lyra-locomotion.glb --require-skin --require-clip idle --require-clip walk --require-clip run --require-clip RESET
          python tools/inspect_glb.py art_source/production/candidates/lyra-motion-library-001/source.glb art_source/production/candidates/lyra-web-001/motion-library.glb --require-skin \
            --require-clip idle --require-clip walk --require-clip run --require-clip RESET \
            --require-clip candidate_sword_slash --require-clip candidate_double_slash --require-clip candidate_combo_slash --require-clip candidate_cross_block \
            --require-clip candidate_left_sidestep --require-clip candidate_right_sidestep --require-clip candidate_light_hit_back --require-clip candidate_hit_fall
      - name: Read pinned engine version
        id: toolchain
        run: python -c 'import json,os; v=json.load(open("tools/toolchain.json"))["godot_version"]; print("godot="+v, file=open(os.environ["GITHUB_OUTPUT"],"a"))'
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/runefall-tools
            /tmp/runefall-data/godot/export_templates
          key: godot-${{ steps.toolchain.outputs.godot }}-linux-web-nothreads-windows-v2
      - name: Set up Godot and export templates
        run: bash tools/setup_godot.sh
      - name: Build and run regression tests
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* || "${{ github.event.inputs.windows }}" == "true" ]]; then
            python tools/build.py --windows
          else
            python tools/build.py
          fi
      - name: Install browser validation tools
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Validate exported WebGL and persistent saves
        timeout-minutes: 7
        run: python tools/check_web.py
      - name: Upload browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-verification-${{ github.sha }}
          path: build/verification
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload playable builds
        uses: actions/upload-artifact@v4
        with:
          name: runefall-${{ github.sha }}
          path: |
            build/runefall-*.zip
            build/manifest.json
          retention-days: 14
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy playable web build
        id: deployment
        uses: actions/deploy-pages@v4

  verify_public_web:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements-dev.txt
      - name: Install browser validation tools
        run: |
          python -m pip install --disable-pip-version-check -r tools/requirements-dev.txt
          python -m playwright install --with-deps chromium
      - name: Check the published HTTPS URL
        id: public_url
        env:
          RUNEFALL_PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          timeout 10s python - <<'PY'
          import os
          import time
          import urllib.error
          import urllib.request
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          owner, repository = os.environ['GITHUB_REPOSITORY'].split('/', 1)
          parts = urlsplit(os.environ['RUNEFALL_PAGE_URL'])
          if (parts.scheme != 'https' or parts.hostname != owner.lower() + '.github.io'
                  or parts.path.rstrip('/') != '/' + repository
                  or parts.port not in (None, 443) or parts.username or parts.password):
              raise SystemExit('Unexpected Pages URL; refusing to probe another origin or repository')
          query = dict(parse_qsl(parts.query))
          query['build'] = os.environ['GITHUB_SHA']
          url = urlunsplit(parts._replace(query=urlencode(query), fragment=''))
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, url):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          # Three two-second requests and two one-second waits: at most eight
          # seconds of socket waits/delays, plus the hard ten-second guard.
          # HTTPS verification stays enabled; redirects cannot probe another origin.
          for attempt in range(3):
              try:
                  with opener.open(url, timeout=2) as response:
                      if response.status == 200:
                          print('Published Pages URL returned HTTP 200')
                          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                              print('url=' + url, file=output)
                          break
              except (urllib.error.URLError, TimeoutError) as error:
                  print(f'Readiness attempt {attempt + 1}/3: {type(error).__name__}')
              if attempt == 2:
                  raise SystemExit('Published Pages URL did not return HTTP 200 within the readiness budget')
              time.sleep(1)
          PY
      - name: Verify public WebGL, input, and browser restart persistence
        timeout-minutes: 7
        env:
          RUNEFALL_TEST_URL: ${{ steps.public_url.outputs.url }}
          RUNEFALL_EXPECTED_COMMIT: ${{ github.sha }}
        run: python tools/browser_smoke.py "$RUNEFALL_TEST_URL"
      - name: Upload public browser verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-web-verification-${{ github.sha }}-${{ github.run_attempt }}
          path: build/verification
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          name: runefall-${{ github.sha }}
          path: dist
      - name: Attach distributions to the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/runefall-web.zip dist/runefall-windows.zip dist/manifest.json --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/runefall-web.zip dist/runefall-windows.zip dist/manifest.json --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "RUNEFALL $GITHUB_REF_NAME" --notes "플레이 가능한 프로토타입입니다. 실행·조작과 현재 구현 상태는 저장소 README를 확인하세요."
          fi
