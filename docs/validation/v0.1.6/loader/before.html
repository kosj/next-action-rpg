<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0e1b24"><title>RUNEFALL · 무너진 성역</title><link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

<style>html,body{overscroll-behavior:none;margin:0;width:100%;height:100%;overflow:hidden;background:#0e1b24;color:#e4dfcf;font-family:system-ui,sans-serif}body{height:100dvh}canvas{touch-action:none;-webkit-user-select:none;user-select:none;display:block;width:100%!important;height:100%!important;outline:0}#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 25%,#294247,#0e1b24 70%);gap:20px}h1{font-size:clamp(25px,5vw,52px);letter-spacing:.35em;font-weight:400;margin:0;color:#d8c291}p{font-size:14px;letter-spacing:.05em;color:#a6bbb5}progress{width:260px;height:3px;accent-color:#89d5c9;border:0}#error{white-space:pre-wrap;max-width:600px;padding:30px;color:#efb19e;text-align:center}#resume{display:none;position:absolute;bottom:25px;left:50%;transform:translateX(-50%);border:1px solid #98b7ac;background:#112b32dd;color:#e8e5d6;padding:12px 24px;cursor:pointer}#safe-area{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}</style></head>
<body><div id="safe-area" aria-hidden="true"></div><canvas id="canvas" tabindex="0" aria-label="RUNEFALL 게임 화면">WebGL 2.0 지원 브라우저가 필요합니다.</canvas><div id="loading"><h1>RUNEFALL</h1><p>무너진 성역으로 향하는 중</p><progress id="progress" max="1" value="0"></progress><div id="error" role="alert"></div></div><button id="resume">화면을 클릭해 조작을 계속하세요</button>
<script src="index.js"></script><script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":102185192,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const loading = document.getElementById('loading');
const error = document.getElementById('error');
const unsupported = Engine.getMissingFeatures({threads: false});
if (unsupported.length) {
  error.textContent = '이 브라우저에서 실행할 수 없습니다.\nChrome 또는 Edge에서 하드웨어 가속을 켜고 다시 실행해 주세요.\n' + unsupported.join(', ');
} else {
  engine.startGame({canvas: document.getElementById('canvas'), onProgress: (current,total) => {if(total>0) document.getElementById('progress').value=current/total;}})
    .then(() => loading.remove())
    .catch(e => {error.textContent='게임을 불러오지 못했습니다. 새로고침 후 다시 시도해 주세요.\n'+String(e);});
}
document.addEventListener('contextmenu', e => e.preventDefault());
</script></body></html>
